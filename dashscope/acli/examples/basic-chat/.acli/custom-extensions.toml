# acli custom extensions — basic-chat example
# ============================================================================
# 最小可用配置：只声明一个 tongyi provider，演示 custom-extensions.toml 的写法。
# 其他 provider（kimi / deepseek / zhipu / ollama / ...）按相同
# 模式添加 [[providers]] 块即可。
#
# 加载位置（任选其一，workspace 优先）：
#   ~/.acli/custom-extensions.toml      全局生效
#   ./.acli/custom-extensions.toml      当前 workspace 生效（覆盖全局同名条目）
#
# API Key 三种写法（按推荐度排序）：
#   1. api_key_env = "DASHSCOPE_API_KEY"   ← 仅存环境变量名，shell 里 export 值
#   2. /provider key tongyi 命令加密存储    ← 写入 api_key = "ENC:..."（机器绑定）
#   3. 明文 api_key = "sk-xxx"              ← 加载器拒绝，仅占位说明
# ============================================================================

[[providers]]
name = "tongyi"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
default_model = "qwen3.7-max"
models = [
    "qwen3.7-max",
    "qwen3.7-plus",
    "qwen-turbo",
    "qwen-vl-max",
    "qwen-vl-plus",
]
vision_models = ["qwen-vl-max", "qwen-vl-plus"]
protocol = "openai"


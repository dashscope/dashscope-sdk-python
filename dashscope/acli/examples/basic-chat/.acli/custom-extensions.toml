# ============================================================================
# [[capabilities]] — HTTP 工具能力（让 LLM 调用外部 API）
# ============================================================================
# 用法：
#   1. 取消注释一个 [[capabilities]] 块（含其下的 [[capabilities.tools]]）
#   2. 设置对应的 env var（如 export ZHIPU_API_KEY=xxx）
#   3. 运行 /capability enable <key> 激活（如 /capability enable zhipu.image）
#   4. 对话中自然语言触发（"画一张猫"）或 LLM 自主调用
#
# 支持两类工具：
#   - type = "http"（默认）— REST API 调用，需填 endpoint + body_template
#   - type = "vision"     — 调用视觉 LLM 读图，需填 provider + model
# ============================================================================

# ---- 示例 1: 智谱 GLM 图像生成（HTTP 工具）----
# export ZHIPU_API_KEY="xxx"
# /capability enable zhipu.image
# 对话中说："画一张停在湖边的自行车"
# [[capabilities]]
# key = "zhipu.image"
# display = "智谱 GLM 图像生成"
# auth = "apikey-header:Authorization:$ZHIPU_API_KEY"
#
# [[capabilities.tools]]
# name = "generate_glm_image"
# description = "调用智谱 GLM-Image 模型根据文本描述生成图片"
# endpoint = "https://open.bigmodel.cn/api/paas/v4/images/generations"
# http_method = "POST"
# permission = "confirm"
# params = [
#   {name = "prompt", type = "string", required = true, description = "图片描述，例如"一辆停在湖边的山地自行车""},
#   {name = "model", type = "string", required = false, default = "glm-image-4v", description = "图像生成模型名"},
#   {name = "size", type = "string", required = false, default = "1024x1024", description = "输出图片尺寸"},
# ]
# body_template = '{"model": {{model}}, "prompt": {{prompt}}, "size": {{size}}}'

# ---- 示例 2: 通义万相图像生成（HTTP 工具，复用 DASHSCOPE_API_KEY）----
# export DASHSCOPE_API_KEY="xxx"
# /capability enable dashscope.image
# [[capabilities]]
# key = "dashscope.image"
# display = "通义万相图像生成"
# api_key_env = "DASHSCOPE_API_KEY"
#
# [[capabilities.tools]]
# name = "generate_wan_image"
# description = "调用通义万相 Wan2.6 / Wanx 模型根据文本描述生成图片"
# endpoint = "https://dashscope.aliyuncs.com/api/v1/services/aigc/text2image/image-synthesis"
# http_method = "POST"
# permission = "confirm"
# params = [
#   {name = "prompt", type = "string", required = true, description = "图片描述"},
#   {name = "model", type = "string", required = false, default = "wanx2.1-t2i-turbo", description = "图像生成模型名"},
#   {name = "size", type = "string", required = false, default = "1024x1024", description = "输出图片尺寸"},
# ]
# body_template = '{"model": {{model}}, "input": {"prompt": {{prompt}}}, "parameters": {"size": {{size}}}}'


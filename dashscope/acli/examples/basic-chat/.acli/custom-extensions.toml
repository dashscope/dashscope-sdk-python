# ============================================================================
# [[skills]] — TOML 声明的 Skill（替代 .md 文件，适合简短模板）
# ============================================================================
# 用法：/skill write_poem 春天   或自然语言触发："写首关于春天的诗"
# 与 .acli/skills/*.md 二选一即可；md 文件支持更长的模板 + frontmatter 元数据。
# 模板用 {{var}} 占位符，调用时由实际值替换。
# ============================================================================

# [[skills]]
# name = "write_poem"
# description = "根据主题写一首中文七言绝句"
# prompt_template = "请写一首关于{{topic}}的七言绝句，要求押韵、意境优美。"
# arguments = ["topic"]

# [[skills]]
# name = "commit_message"
# description = "根据 git diff 生成 Conventional Commits 格式的 commit message"
# prompt_template = "根据以下 git diff 生成 commit message（Conventional Commits 格式，不超过 50 字）：\n\n{{diff}}"
# arguments = ["diff"]

# ============================================================================
# [[shell_tools]] — 本地命令包装为 LLM 可调用工具
# ============================================================================
# LLM 自动调用，或用户通过 /skill <name> 显式触发。
# permission:
#   auto      — 自动执行（适合只读命令）
#   confirm   — 每次执行前确认（默认，适合有副作用的命令）
#   dangerous — 高危，少用（如 rm -rf）
# 模板用 {{var}} 占位符，参数定义同 [[capabilities.tools]].params。
# ============================================================================

# ---- 示例 1: ripgrep 搜索文件内容（只读，auto）----

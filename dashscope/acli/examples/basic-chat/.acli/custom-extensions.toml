# ============================================================================
# [[capabilities]] — HTTP tool capabilities (let the LLM call external APIs)
# ============================================================================
# Usage:
#   1. Uncomment a [[capabilities]] block (including its [[capabilities.tools]])
#   2. Set the corresponding env var (e.g. export ZHIPU_API_KEY=xxx)
#   3. Run /capability enable <key> to activate it (e.g. /capability enable zhipu.image)
#   4. Trigger it with natural language in chat ("draw a cat") or let the LLM call it autonomously
#
# Two tool types are supported:
#   - type = "http" (default) — REST API call; requires endpoint + body_template
#   - type = "vision"         — calls a vision LLM to read images; requires provider + model
# ============================================================================

# ---- Example 1: Zhipu GLM image generation (HTTP tool) ----
# export ZHIPU_API_KEY="xxx"
# /capability enable zhipu.image
# Say in chat: "draw a bicycle parked by a lake"
# [[capabilities]]
# key = "zhipu.image"
# display = "Zhipu GLM Image Generation"
# auth = "apikey-header:Authorization:$ZHIPU_API_KEY"
#
# [[capabilities.tools]]
# name = "generate_glm_image"
# description = "Generate an image from a text description with the Zhipu GLM-Image model"
# endpoint = "https://open.bigmodel.cn/api/paas/v4/images/generations"
# http_method = "POST"
# permission = "confirm"
# params = [
#   {name = "prompt", type = "string", required = true, description = "Image description, e.g. 'a mountain bike parked by a lake'"},
#   {name = "model", type = "string", required = false, default = "glm-image-4v", description = "Image generation model name"},
#   {name = "size", type = "string", required = false, default = "1024x1024", description = "Output image size"},
# ]
# body_template = '{"model": {{model}}, "prompt": {{prompt}}, "size": {{size}}}'


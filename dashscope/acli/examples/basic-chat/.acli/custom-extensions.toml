# acli custom extensions — basic-chat example
# ============================================================================
# Minimal working config: declares only one tongyi provider, demonstrating how
# to write custom-extensions.toml. Add other providers (kimi / deepseek /
# zhipu / ollama / ...) by adding [[providers]] blocks following the same
# pattern.
#
# Load locations (either one; workspace takes precedence):
#   ~/.acli/custom-extensions.toml      applies globally
#   ./.acli/custom-extensions.toml      applies to the current workspace (overrides same-name global entries)
#
# Three ways to provide an API key (in order of recommendation):
#   1. api_key_env = "DASHSCOPE_API_KEY"   ← stores only the env var name; export the value in the shell
#   2. /provider key tongyi command (encrypted storage) ← writes api_key = "ENC:..." (machine-bound)
#   3. Plaintext api_key = "sk-xxx"         ← rejected by the loader; placeholder illustration only
# ============================================================================

[[providers]]
name = "tongyi"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
default_model = "qwen3.7-max"
models = [
    "qwen3.7-max",
    "qwen3.7-plus",
    "qwen-turbo",
    "qwen-vl-max",
    "qwen-vl-plus",
]
vision_models = ["qwen-vl-max", "qwen-vl-plus"]
protocol = "openai"


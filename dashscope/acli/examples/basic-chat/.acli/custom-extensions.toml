# ============================================================================
# [[skills]] — Skills declared in TOML (alternative to .md files; good for short templates)
# ============================================================================
# Usage: /skill write_poem spring   or a natural-language trigger: "write a poem about spring"
# Choose either this or .acli/skills/*.md; md files support longer templates + frontmatter metadata.
# Templates use {{var}} placeholders, replaced with actual values on invocation.
# ============================================================================

# [[skills]]
# name = "write_poem"
# description = "Write a Chinese seven-character quatrain on a given topic"
# prompt_template = "Write a seven-character quatrain about {{topic}}, with rhyme and elegant imagery."
# arguments = ["topic"]

# [[skills]]
# name = "commit_message"
# description = "Generate a Conventional Commits format commit message from a git diff"
# prompt_template = "Generate a commit message from the following git diff (Conventional Commits format, max 50 characters):\n\n{{diff}}"
# arguments = ["diff"]

# ============================================================================
# [[shell_tools]] — Wrap local commands as LLM-callable tools
# ============================================================================
# Called automatically by the LLM, or explicitly triggered by the user via /skill <name>.
# permission:
#   auto      — run automatically (good for read-only commands)
#   confirm   — confirm before each run (default; good for commands with side effects)
#   dangerous — high risk, use sparingly (e.g. rm -rf)
# Templates use {{var}} placeholders; parameter definitions are the same as [[capabilities.tools]].params.
# ============================================================================

# ---- Example 1: ripgrep file-content search (read-only, auto) ----
# [[shell_tools]]
# name = "search_file"
# description = "Search file contents matching a regex under the given path with ripgrep"
# command_template = "rg -n {{pattern}} {{path}}"
# permission = "auto"
# params = [
#   {name = "pattern", type = "string", required = true, description = "Search regex"},
#   {name = "path", type = "string", required = false, default = ".", description = "Search path"},
# ]


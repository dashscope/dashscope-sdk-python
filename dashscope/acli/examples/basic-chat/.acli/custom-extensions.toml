# ---- Example 3: Tongyi vision understanding (vision tool, calls qwen-vl-max to read images) ----
# Lets the text agent call a vision model on demand to understand images; no need to switch the main model.
# Usage: /capability enable tongyi.vision, then say "look at this image @photo.png and describe it"
# export DASHSCOPE_API_KEY="xxx"
# [[capabilities]]
# key = "tongyi.vision"
# display = "Tongyi Vision Understanding (qwen-vl-max)"
# api_key_env = "DASHSCOPE_API_KEY"
#
# [[capabilities.tools]]
# name = "understand_image"
# type = "vision"
# provider = "tongyi"
# model = "qwen-vl-max"
# description = "Understand image content with a vision model and return a text description. No need to switch the main model."
# permission = "auto"
# params = [
#   {name = "image_path", type = "string", required = true, description = "Image file path (png/jpg/jpeg/gif/webp/bmp)"},
#   {name = "question", type = "string", required = false, default = "Describe the content of this image", description = "Question about the image"},
# ]


# acli custom extensions — dashscope-sdk-expert example
# ============================================================================
# Declares the tongyi provider for the SDK Expert example. After copying this
# example, add more providers or capabilities as needed. See
# examples/basic-chat/.acli/custom-extensions.toml for detailed field
# documentation.
# ============================================================================

[[providers]]
name = "tongyi"
base_url = "https://dashscope.aliyuncs.com/compatible-mode/v1"
api_key_env = "DASHSCOPE_API_KEY"
default_model = "qwen3.8-max"
models = [
    "qwen3.8-max",
    "qwen3.7-max",
    "qwen3.7-plus",
    "qwen3.8-flash",
    "qwen3-vl-flash",
    "qwen3-vl-plus",
]
vision_models = ["qwen3-vl-flash", "qwen3-vl-plus"]
protocol = "openai"

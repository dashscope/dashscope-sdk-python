[[hooks.after_tool_call]]
match = "write_file"
condition = "*.py"
action = "run"
run = "python -m py_compile {path}"
on_fail = "warn"
silent = true

[[hooks.after_tool_call]]
match = "write_file"
condition = "*.py"
action = "log"
message = "{timestamp} | wrote {filename}"

[[hooks.before_tool_call]]
match = "run_command"
content_pattern = "*pip*install*"
action = "confirm"
message = "即将执行 pip 安装，确认吗？"

[[hooks.on_error]]
match = "*"
content_pattern = "*ModuleNotFoundError*"
action = "warn"
message = "检测到模块缺失。先检查 dashscope 是否已安装：pip show dashscope"

# OPD capability combinations:
# - Remove both function blocks: Teacher only.
# - Keep only the reward block: Teacher + Reward.
# - Keep only the rollout block: Teacher + Rollout.
# - Keep both blocks (the current configuration): Teacher + Rollout + Reward.
name: opd-from-yaml
model:
  name: qwen3.5-9b
teacher_model: qwen3.5-397b-a17b
functions:
# Optional OPD capability: remove this block to use platform generation.
- type: rollout
  name: rollout-1
  timeout: 600
  fcmodel:
    zipdir: ./
    classpath: functions.rollout.rollout.CalcXRolloutProcessor
    requirements_path: ./requirements.txt
  runtime:
    cpu: 2.0
    memory_size: 4096
    disk_size: 512
    concurrency: 30
    capacity: 30
    max_capacity: 60
    min_capacity: 30
    memory_scale_threshold: 0.6
    concurrency_scale_threshold: 0.6
    env: {}
# Optional OPD capability: remove this block to disable custom task rewards.
- type: reward
  name: rewards-1
  timeout: 120
  fcmodel:
    zipdir: ./
    classpath: functions.reward.reward.DemoRewardProcessor
    requirements_path: ./requirements.txt
  runtime:
    cpu: 2.0
    memory_size: 4096
    disk_size: 512
    concurrency: 30
    capacity: 30
    max_capacity: 60
    min_capacity: 30
    memory_scale_threshold: 0.6
    concurrency_scale_threshold: 0.6
    env: {}
  weight: 1.0
  reward_metric_weight:
    reward_metric_weightA: 0.3
    reward_metric_weightB: 0.7
datasets:
- type: training
  data_source_type: file_id
  file_name: ./data/calc_train_min.jsonl
- type: validation
  data_source_type: file_id
  file_name: ./data/calc_validation_min.jsonl
training:
  type: pg_opd
  hyper_parameters:
    eval_steps: 1
    kl_loss_coef: 0.002
    learning_rate: 2e-6
    lr_scheduler_type: cosine
    n_epochs: 1
    n_rollouts: 8
    ppo_mini_batch_size: 8
observability: {}

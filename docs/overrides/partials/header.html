{#-
  Material header with keyboard-operable mobile drawer and search toggles.
  The drawer uses a native button for Enter/Space behavior; the search toggle
  must stay a <label for="__search"> because Material's JS binds click-to-focus
  to the FIRST "header [for=__search]" element -- a button here would make it
  bind the fullscreen .md-search__overlay instead, and every outside click
  would refocus the query and reopen the dialog. role=button + tabindex +
  Enter/Space keep the label keyboard-operable; the checkboxes retain the
  theme's CSS drawer/search behavior and localized names expose the controls.
-#}
{% set zh = (i18n_page_locale | default(config.theme.get("language", "en"))) == "zh" %}
{% set class = "md-header" %}
{% if "navigation.tabs.sticky" in features %}
  {% set class = class ~ " md-header--shadow md-header--lifted" %}
{% elif "navigation.tabs" not in features %}
  {% set class = class ~ " md-header--shadow" %}
{% endif %}
<header class="{{ class }}" data-md-component="header">
  <nav class="md-header__inner md-grid" aria-label="{{ lang.t('header') }}">
    <a href="{{ config.extra.homepage | d(nav.homepage.url, true) | url }}" title="{{ config.site_name | e }}" class="md-header__button md-logo" aria-label="{{ config.site_name }}" data-md-component="logo">
      {% include "partials/logo.html" %}
    </a>
    <button class="md-header__button md-icon md-header__toggle md-header__toggle--drawer" type="button"
            aria-label="{{ '打开导航菜单' if zh else 'Open navigation' }}"
            onclick="document.getElementById('__drawer').click()">
      {% set icon = config.theme.icon.menu or "material/menu" %}
      {% include ".icons/" ~ icon ~ ".svg" %}
    </button>
    {#- No-JS fallback: the button above needs scripting, so when scripts are
        disabled render the theme's original CSS-only label instead (hidden
        via .no-js while the button is active). -#}
    <noscript>
      <label class="md-header__button md-icon md-header__toggle md-header__toggle--drawer"
             for="__drawer" aria-label="{{ '打开导航菜单' if zh else 'Open navigation' }}">
        {% set icon = config.theme.icon.menu or "material/menu" %}
        {% include ".icons/" ~ icon ~ ".svg" %}
      </label>
    </noscript>
    <div class="md-header__title" data-md-component="header-title">
      <div class="md-header__ellipsis">
        <div class="md-header__topic">
          <span class="md-ellipsis">
            {{ config.site_name }}
          </span>
        </div>
        <div class="md-header__topic" data-md-component="header-topic">
          <span class="md-ellipsis">
            {% if page.meta and page.meta.title %}
              {{ page.meta.title }}
            {% else %}
              {{ page.title }}
            {% endif %}
          </span>
        </div>
      </div>
    </div>
    {% if config.theme.palette %}
      {% if not config.theme.palette is mapping %}
        {% include "partials/palette.html" %}
      {% endif %}
    {% endif %}
    {% if not config.theme.palette is mapping %}
      {% include "partials/javascripts/palette.html" %}
    {% endif %}
    {% if config.extra.alternate %}
      {% include "partials/alternate.html" %}
    {% endif %}
    {% if "material/search" in config.plugins %}
      {% set search = config.plugins["material/search"] | attr("config") %}
      {% if search.enabled %}
        <label class="md-header__button md-icon md-header__toggle md-header__toggle--search" for="__search"
               role="button" tabindex="0"
               aria-label="{{ '打开搜索' if zh else 'Open search' }}"
               onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();this.click();}">
          {% set icon = config.theme.icon.search or "material/magnify" %}
          {% include ".icons/" ~ icon ~ ".svg" %}
        </label>
        {% include "partials/search.html" %}
      {% endif %}
    {% endif %}
    {% if config.repo_url %}
      <div class="md-header__source">
        {% include "partials/source.html" %}
      </div>
    {% endif %}
  </nav>
  {% if "navigation.tabs.sticky" in features %}
    {% if "navigation.tabs" in features %}
      {% include "partials/tabs.html" %}
    {% endif %}
  {% endif %}
</header>
